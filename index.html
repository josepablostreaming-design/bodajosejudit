    .timeline-icon:active,.timeline-icon.is-tapped { transform:translateY(-50%) scale(1.13) rotate(-3deg); box-shadow:0 10px 24px rgba(79,95,75,.16); background:#fffdf8; }
    .itinerary-copy { font-size:.76rem; line-height:1.55; letter-spacing:.055em; max-width:10.5rem; }
    .itinerary-item:nth-child(odd).is-visible { animation:timelineFromLeft .65s cubic-bezier(.22,1,.36,1) both; }
    .itinerary-item:nth-child(even).is-visible { animation:timelineFromRight .65s cubic-bezier(.22,1,.36,1) both; }
    @keyframes timelineFromLeft { from{opacity:0;transform:translateX(-16px)} to{opacity:1;transform:none} }
    @keyframes timelineFromRight { from{opacity:0;transform:translateX(16px)} to{opacity:1;transform:none} }

    /* Corazones separadores: pequeños descubrimientos, no animación constante */
    .itinerary-ornament.interactive-heart { pointer-events:auto; cursor:pointer; touch-action:manipulation; }
    .interactive-heart span,[data-template-id="welcome-heart"],[data-template-id="closing-heart"] { display:inline-block; transform-origin:center; cursor:pointer; user-select:none; }
    .interactive-heart.is-heart-active span,[data-template-id="welcome-heart"].is-heart-active,[data-template-id="closing-heart"].is-heart-active { animation:heartTap .72s cubic-bezier(.2,.8,.2,1); }
    @keyframes heartTap { 0%,100%{transform:scale(1)} 24%{transform:scale(1.42) rotate(-5deg)} 48%{transform:scale(.96)} 72%{transform:scale(1.20) rotate(3deg)} }

    /* Música solo para quienes confirmaron que asistirán */

    #song-form.song-form-locked { display:none; }

    /* Ritmo y cierre */

    .feature-illustration.is-tapped { animation:featureTap .72s cubic-bezier(.2,.8,.2,1); }
    .feature-illustration.is-visible .music-note-a { animation:noteFloat 2.2s ease-in-out infinite; transform-origin:center; }

    .feature-illustration.is-visible .gift-spark { animation:sparkleGift 1.8s ease-in-out infinite; transform-origin:center; }
    @keyframes featureTap { 50% { transform:scale(1.10) rotate(3deg); } }
    @keyframes noteFloat { 0%,100% { transform:translateY(0) rotate(0); opacity:.72; } 50% { transform:translateY(-2.2px) rotate(5deg); opacity:1; } }

/* ===== V3 EDITORIAL + ANIMACIONES ===== */
:root{
  --ivory:#F7F3EA; --eucalyptus:#4F5F4B; --champagne:#B49558;
  --taupe:#625F57; --sage:#65765D;
}

/* Hero: no botanical bleed; names use explicit, unmistakable ampersand */
[data-template-id="welcome-section"]{overflow:hidden!important;}
[data-template-id="welcome-section"] .botanical-decoration,
[data-template-id="welcome-section"] .botanical,
[data-template-id="welcome-section"] img[src*="ChatGPT"]{display:none!important;}
.couple-lockup{
  display:flex;align-items:baseline;justify-content:center;gap:.18em;
  color:var(--taupe);white-space:nowrap;margin:0 auto;
}
.couple-lockup .couple-name{
  font-family:"Yellowtail","Great Vibes",cursive;font-size:1em;line-height:1;
}
.couple-lockup .couple-amp{
  font-family:"Playfair Display",serif;font-style:italic;font-weight:500;
  font-size:.62em;color:var(--champagne);display:inline-block;
  transform:translateY(-.04em);margin:0 .05em;
}
[data-template-id="welcome-title"].couple-lockup{font-size:clamp(3.05rem,13vw,4rem)!important;}
[data-template-id="closing-names"].couple-lockup{font-size:clamp(2.1rem,9vw,2.85rem)!important;}

/* Organic chapter bands: real filled torn strips, not tiny triangles */
.chapter-band{
  position:relative;background:var(--eucalyptus);color:var(--ivory);
  min-height:7.2rem;display:flex;align-items:center;justify-content:center;
  margin:0;padding:1.8rem 1.25rem;text-align:center;overflow:hidden;
}
.chapter-band::before,.chapter-band::after{
  content:"";position:absolute;left:-2%;width:104%;height:18px;background:var(--ivory);
}
.chapter-band::before{top:-9px;clip-path:polygon(0 48%,5% 72%,11% 45%,17% 68%,23% 39%,30% 66%,37% 42%,44% 70%,51% 40%,58% 67%,66% 44%,73% 71%,81% 41%,89% 66%,95% 43%,100% 62%,100% 0,0 0);}
.chapter-band::after{bottom:-9px;clip-path:polygon(0 52%,6% 31%,13% 58%,20% 35%,27% 61%,34% 33%,42% 59%,49% 30%,57% 61%,65% 36%,72% 60%,80% 32%,88% 58%,95% 35%,100% 55%,100% 100%,0 100%);}
.chapter-band .animated-heart{color:var(--champagne);}

/* New animated heart artwork */
.animated-heart{
  width:3.25rem;height:3.25rem;display:grid;place-items:center;margin:auto;
  cursor:pointer;touch-action:manipulation;
}
.animated-heart svg{width:100%;height:100%;overflow:visible}
.animated-heart .heart-main{fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round;transform-origin:center;animation:heartPulseV3 2.45s ease-in-out infinite}
.animated-heart .heart-spark{fill:currentColor;transform-origin:center;animation:heartSparkV3 2.45s ease-in-out infinite}
@keyframes heartPulseV3{0%,100%{transform:scale(.96)}42%{transform:scale(1.08)}52%{transform:scale(1.01)}63%{transform:scale(1.09)}}
@keyframes heartSparkV3{0%,30%,100%{opacity:.15;transform:scale(.6)}48%,68%{opacity:.9;transform:scale(1)}}

/* Tighter section rhythm */
.personal-invite-section{padding-top:3.7rem!important;padding-bottom:3.7rem!important}
[data-template-id="venue-section"]{padding-top:3.8rem!important;padding-bottom:3.8rem!important}
[data-template-id="rsvp-section"],[data-template-id="dress-section"],
[data-template-id="song-section"],[data-template-id="gift-section"]{
  padding-top:4.1rem!important;padding-bottom:4.1rem!important;
}
.parents-panel{padding-top:4rem!important;padding-bottom:4rem!important}

/* Editorial two-font hierarchy */
.editorial-kicker{font-family:"DM Sans",sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.23em;text-transform:uppercase;color:var(--champagne)}
.editorial-display{font-family:"Playfair Display",serif;font-style:italic;font-weight:500;color:var(--eucalyptus)}
.editorial-pill{display:inline-block;border:1px solid rgba(180,149,88,.58);border-radius:999px;padding:.48rem 1rem;font-family:"DM Sans",sans-serif;font-size:.67rem;letter-spacing:.15em;text-transform:uppercase;color:var(--eucalyptus);background:rgba(247,243,234,.55)}

/* Itinerary: editorial and animated SVG scene */
[data-template-id="itinerary-title"]{font-family:"Oregano",cursive!important;font-style:normal!important;font-size:clamp(2.45rem,10vw,3.2rem)!important;color:var(--eucalyptus)!important;letter-spacing:.02em!important}
.itinerary-time{font-family:"Playfair Display",serif!important;font-style:italic;font-size:1.12rem!important;color:var(--champagne)!important;letter-spacing:.05em!important}
.itinerary-event{font-family:"DM Sans",sans-serif!important;font-size:.73rem!important;line-height:1.35!important;letter-spacing:.08em!important;font-weight:600!important;color:var(--eucalyptus)!important}
.timeline-icon{width:5rem!important;height:5rem!important;right:-2.5rem!important;border-color:rgba(180,149,88,.34)!important}
.itinerary-item:nth-child(even) .timeline-icon{left:-2.5rem!important;right:auto!important}
.timeline-icon svg{width:3.65rem!important;height:3.65rem!important}
.timeline-icon .anim-part{transform-box:fill-box;transform-origin:center}
.timeline-icon.is-visible .clink-left{animation:clinkL 2.6s ease-in-out infinite}
.timeline-icon.is-visible .clink-right{animation:clinkR 2.6s ease-in-out infinite}
.timeline-icon.is-visible .note{animation:noteUp 2.2s ease-in-out infinite}
.timeline-icon.is-visible .cloche{animation:clocheLift 2.8s ease-in-out infinite}
.timeline-icon.is-visible .spark{animation:sparkV3 1.8s ease-in-out infinite}
.timeline-icon.is-visible .car-body{animation:carRide 3s ease-in-out infinite}
.timeline-icon.is-visible .wheel{animation:wheelSpin 1.1s linear infinite}
.timeline-icon.is-visible .rings{animation:ringsGlow 2.5s ease-in-out infinite}
.timeline-icon.is-visible .entrance{animation:entranceMove 2.7s ease-in-out infinite}
@keyframes clinkL{50%{transform:translate(2px,-1px) rotate(5deg)}}
@keyframes clinkR{50%{transform:translate(-2px,-1px) rotate(-5deg)}}
@keyframes noteUp{0%,100%{transform:translateY(1px);opacity:.55}50%{transform:translateY(-3px);opacity:1}}
@keyframes clocheLift{50%{transform:translateY(-2.5px)}}
@keyframes sparkV3{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
@keyframes carRide{0%,100%{transform:translateX(-2px)}50%{transform:translateX(3px)}}
@keyframes wheelSpin{to{transform:rotate(360deg)}}
@keyframes ringsGlow{50%{transform:scale(1.08)}}
@keyframes entranceMove{50%{transform:translateY(-2px)}}

/* Music and gift artwork: larger and lively */
.feature-illustration{width:7.3rem!important;height:7.3rem!important;margin-bottom:1rem!important}
.feature-illustration svg{width:5.25rem!important;height:5.25rem!important}
[data-template-id="song-eyebrow"],[data-template-id="gift-eyebrow"]{font-size:clamp(2.25rem,9vw,2.85rem)!important}
[data-template-id="song-question"]{font-family:"Playfair Display",serif!important;font-style:italic;color:var(--eucalyptus)!important;font-size:1.22rem!important}

/* RSVP date as an informational capsule */
[data-template-id="rsvp-deadline"]{display:inline-block!important;border:1px solid rgba(180,149,88,.55);border-radius:999px;padding:.48rem 1.1rem;margin-top:.55rem;color:var(--eucalyptus)!important}

/* Dress: clearer hierarchy, keep elegant icons */
[data-template-id="dress-title"]{font-family:"Playfair Display",serif!important;font-size:2rem!important;letter-spacing:.05em!important;color:var(--eucalyptus)!important}
[data-template-id="dress-eyebrow"]{font-family:"Oregano",cursive!important;font-size:2.4rem!important;color:var(--taupe)!important}

/* Gift QR frame */
.qr-frame{border:1px solid rgba(180,149,88,.52)!important;border-radius:1.15rem!important;padding:.7rem!important}

/* closing calm */
[data-template-id="closing-section"]{overflow:hidden}
@media(max-width:420px){
  .timeline-icon{width:4.65rem!important;height:4.65rem!important;right:-2.325rem!important}
  .itinerary-item:nth-child(even) .timeline-icon{left:-2.325rem!important}
  .timeline-icon svg{width:3.35rem!important;height:3.35rem!important}
  .itinerary-item{min-height:8.65rem!important}
}
@media(prefers-reduced-motion:reduce){
  .animated-heart *, .timeline-icon *, .feature-illustration *{animation:none!important}
}

/* ---------- 1. PORTADA ---------- */
[data-template-id="welcome-section"]{overflow:hidden!important;}
[data-template-id="welcome-title"].couple-lockup{
  font-size:clamp(3.35rem,14.4vw,4.45rem)!important;
  gap:.12em!important;
  margin-bottom:1.05rem!important;
}
.couple-lockup .couple-name{
  font-family:"Yellowtail","Great Vibes",cursive!important;
  color:#4F5F4B!important;
}
.couple-lockup .couple-amp{
  font-family:"Playfair Display",serif!important;
  font-style:normal!important;
  font-weight:600!important;
  font-size:.52em!important;
  color:#B49558!important;
  margin:0 .14em!important;
  transform:translateY(-.08em)!important;

  color:#4F5F4B!important;
  font-size:.88em!important;

}
/* Heart order is handled below by JS; this is the filled hero heart */
.hero-filled-heart{
  width:3.35rem;height:3.35rem;margin:.15rem auto .25rem;
  display:grid;place-items:center;cursor:pointer;touch-action:manipulation;
}
.hero-filled-heart svg{width:100%;height:100%;overflow:visible}
.hero-filled-heart .main{
  fill:#B49558;stroke:#B49558;stroke-width:1;
  transform-origin:center;
  animation:heroDoubleBeat 3.1s ease-in-out infinite;
}
.hero-filled-heart .particle{
  fill:#B49558;opacity:0;transform-origin:center;
}
.hero-filled-heart.is-tapped .particle.p1{animation:floatHeart 820ms ease-out forwards}
.hero-filled-heart.is-tapped .particle.p2{animation:floatHeart2 900ms ease-out 80ms forwards}
@keyframes heroDoubleBeat{
  0%,18%,100%{transform:scale(1)}
  6%{transform:scale(1.12)}
  12%{transform:scale(1.02)}
  17%{transform:scale(1.10)}
}
@keyframes floatHeart{
  0%{opacity:0;transform:translate(0,0) scale(.45)}
  20%{opacity:.9}
  100%{opacity:0;transform:translate(-8px,-18px) scale(.9)}
}
@keyframes floatHeart2{

<script>
  const SUPABASE_URL = "https://liwmrmmhsgiojvxxlbpo.supabase.co";

</script>

  <script>
    const cover = document.getElementById("cover");
    const invitationTemplate = document.getElementById("invitation-template");
    const invitation = invitationTemplate.content.firstElementChild;
    const openButton = document.getElementById("open-button");
    const queryParams = new URLSearchParams(window.location.search);
    const testId = queryParams.get('i') || queryParams.get('id') || 'PRUEBA-NUEVA-LUCAS-SOFIA'; // V10 preview fallback; real guest links override this
    const musicButton = document.getElementById("music-button");
    const backgroundAudio = new Audio("https://pub-ee4fabce611c414d8d3d86a464ddd1bb.r2.dev/AUD-20260913-WA0034.mp3");
    backgroundAudio.loop = true;
    backgroundAudio.preload = "auto";
    backgroundAudio.volume = 0.5;
    let musicStarted = false;
    let musicPaused = false;
    let records = [];
    let countdownInterval;
    let invitationInitialized = false;

    function updateCountdown() {
      const target = new Date("2026-10-03T15:00:00-04:00").getTime();
      const diff = Math.max(0, target - Date.now());
      const values = [Math.floor(diff / 86400000), Math.floor(diff / 3600000) % 24, Math.floor(diff / 60000) % 60, Math.floor(diff / 1000) % 60];
      ["count-days", "count-hours", "count-minutes", "count-seconds"].forEach((id, i) => {
        const element = document.getElementById(id);
        if (element) element.textContent = String(values[i]).padStart(2, "0");
      });
    }

    function beginMusic() {
      if (!musicStarted) {
        backgroundAudio.currentTime = 0;
        musicStarted = true;
        musicPaused = false;
        const playAttempt = backgroundAudio.play();
        if (playAttempt && typeof playAttempt.catch === "function") playAttempt.catch(() => {});
      }
      musicButton.classList.add("is-playing");
      musicButton.setAttribute("aria-pressed", "true");
    }

    function pauseMusic() {
      musicPaused = true;
      backgroundAudio.pause();
      musicButton.classList.remove("is-playing");
      musicButton.setAttribute("aria-pressed", "false");
    }

    function resumeMusic() {
      musicPaused = false;
      const playAttempt = backgroundAudio.play();
      if (playAttempt && typeof playAttempt.catch === "function") playAttempt.catch(() => {});
      musicButton.classList.add("is-playing");
      musicButton.setAttribute("aria-pressed", "true");
    }

    function requestInvitationFullscreen() {
      const root = document.documentElement;
      const requestFullscreen = root.requestFullscreen
        || root.webkitRequestFullscreen
        || root.msRequestFullscreen;

      if (!requestFullscreen) return;

      try {
        const fullscreenAttempt = requestFullscreen.call(root);
        if (fullscreenAttempt && typeof fullscreenAttempt.catch === "function") {
          fullscreenAttempt.catch(() => {});
        }
      } catch (error) {}
    }

    openButton.addEventListener("click", () => {
      // Fullscreen and audio are both requested directly from the guest's tap.
      // Browsers that do not support fullscreen simply continue normally.
      requestInvitationFullscreen();
      try { beginMusic(); } catch (error) {}
      document.body.appendChild(invitation);
      invitation.classList.add("is-opening");
      cover.classList.add("is-hidden");
      initializeInvitationContent();
      window.setTimeout(() => {
        cover.remove();
        invitation.classList.remove("is-opening");
        invitation.classList.add("is-open");
        musicButton.classList.add("visible");
        document.documentElement.style.height = "auto";
        document.documentElement.style.overflowY = "scroll";
        document.documentElement.style.overflowX = "hidden";
        document.body.style.height = "auto";
        document.body.style.overflowY = "auto";
        document.body.style.overflowX = "hidden";
      }, 800);
    });

    musicButton.addEventListener("click", async () => {
      if (musicPaused) await resumeMusic();
      else pauseMusic();
    });

    async function supabaseRpc(functionName, body) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${functionName}`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });
      if (!response.ok) throw new Error(await response.text());
      return await response.json();
    }

    async function loadInvitation(code) {
      // RPC created in Supabase during setup. Supports the invitation code only; no guest list is exposed.
      const rows = await supabaseRpc("get_invitation", { p_code: code });
      return Array.isArray(rows) ? rows[0] : rows;
    }

    async function saveRsvp(code, attending, guestsCount, dietary, message) {
      const rows = await supabaseRpc("save_rsvp", {
        p_code: code,
        p_attending: attending,
        p_guests_count: guestsCount,
        p_dietary_requirements: dietary,
        p_message: message
      });
      return Array.isArray(rows) ? rows[0] : rows;
    }

    async function saveSongSuggestion(code, song) {
      const rows = await supabaseRpc("save_song_suggestion", {
        p_code: code,
        p_song: song
      });
      return Array.isArray(rows) ? rows[0] : rows;
    }

    function initializeInvitationContent() {
      if (invitationInitialized) return;
      invitationInitialized = true;

      const countDays = document.getElementById("count-days");
      const countHours = document.getElementById("count-hours");
      const countMinutes = document.getElementById("count-minutes");
      const countSeconds = document.getElementById("count-seconds");
      const rsvpForm = document.getElementById("rsvp-form");
      const formError = document.getElementById("form-error");
      const successPanel = document.getElementById("rsvp-success");
      const submitButton = document.getElementById("submit-rsvp");

      if (countDays && countHours && countMinutes && countSeconds) {
        updateCountdown();
        countdownInterval = window.setInterval(updateCountdown, 1000);
      }

      const itineraryItems = document.querySelectorAll(".itinerary-item");
      if (itineraryItems.length && "IntersectionObserver" in window) {
        const itineraryObserver = new IntersectionObserver(entries => entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            itineraryObserver.unobserve(entry.target);
          }
        }), { threshold: .2 });
        itineraryItems.forEach(item => itineraryObserver.observe(item));
      } else {
        itineraryItems.forEach(item => item.classList.add("is-visible"));
      }

      const revealTargets = document.querySelectorAll("#invitation > section > .section-inner, #invitation > section > .opening-photo, #invitation > section > .opening-copy, #invitation > .final-couple-photo > img, #invitation > footer > .section-inner");
      revealTargets.forEach(target => target.classList.add("scroll-reveal"));
      if ("IntersectionObserver" in window) {
        const revealObserver = new IntersectionObserver(entries => entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-revealed");
            revealObserver.unobserve(entry.target);
          }
        }), { threshold: .12 });
        revealTargets.forEach(target => revealObserver.observe(target));
      } else {
        revealTargets.forEach(target => target.classList.add("is-revealed"));
      }

      document.querySelectorAll(".timeline-icon").forEach(icon => {
        const react = () => {
          icon.classList.remove("is-tapped");
          void icon.offsetWidth;
          icon.classList.add("is-tapped");
          window.setTimeout(() => icon.classList.remove("is-tapped"), 650);
        };
        icon.addEventListener("click", react);
        icon.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); react(); } });
      });


      document.querySelectorAll(".interactive-feature").forEach(feature => {
        const reactFeature = () => {
          feature.classList.remove("is-tapped");
          void feature.offsetWidth;
          feature.classList.add("is-tapped");
          window.setTimeout(() => feature.classList.remove("is-tapped"), 760);
        };
        feature.addEventListener("click", reactFeature);
        feature.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reactFeature(); }
        });
      });

      document.querySelectorAll(".interactive-heart, [data-template-id='welcome-heart'], [data-template-id='closing-heart']").forEach(heart => {
        const pulse = () => {
          heart.classList.remove("is-heart-active");
          void heart.offsetWidth;
          heart.classList.add("is-heart-active");
          window.setTimeout(() => heart.classList.remove("is-heart-active"), 800);
        };
        heart.addEventListener("click", pulse);
        heart.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pulse(); } });
      });

      if (!rsvpForm || !formError || !successPanel || !submitButton) return;

      const attendingQuestion = document.getElementById("attending-question");
      const personalInviteSection = document.getElementById("personal-invite-section");
      const personalInviteName = document.getElementById("personal-invite-name");
      const personalInviteCopy1 = document.getElementById("personal-invite-copy-1");
      const personalInviteCount = document.getElementById("personal-invite-count");
      const rsvpLoading = document.getElementById("rsvp-loading");
      const rsvpEditNote = document.getElementById("rsvp-edit-note");
      const attendingInput = document.getElementById("attending");
      const guestsCountInput = document.getElementById("guests-count");
      const guestsCountField = document.getElementById("guests-count-field");
      const dietaryInput = document.getElementById("dietary");
      const messageInput = document.getElementById("message");
      let invitationRecord = null;
      const songForm = document.getElementById("song-form");
      const songLocked = document.getElementById("song-locked");
      const songInput = document.getElementById("song-suggestion");
      const songButton = document.getElementById("submit-song");
      const songError = document.getElementById("song-error");
      const songSuccess = document.getElementById("song-success");

      function syncSongAccess() {
        const canSuggest = !!(invitationRecord && invitationRecord.has_rsvp === true && invitationRecord.attending === true);
        if (!songForm || !songLocked) return;
        songForm.classList.toggle("song-form-locked", !canSuggest);
        if (!songForm.classList.contains("song-form-submitted")) {
          songForm.classList.toggle("song-form-enabled", canSuggest);
        }
        songLocked.classList.toggle("is-hidden", canSuggest);
        if (!canSuggest) {
          songForm.classList.remove("song-form-submitted");
          songSuccess?.classList.remove("visible");
          if (songInput) songInput.value = "";
          songLocked.textContent = invitationRecord && invitationRecord.has_rsvp === true && invitationRecord.attending === false
            ? "Las sugerencias musicales están reservadas para quienes podrán acompañarnos en la celebración."
            : "Primero confirma tu asistencia. Si podrás acompañarnos, aquí se habilitará tu sugerencia musical.";
        }
      }

      function syncDietaryAccess() {
        const canEditDietary = attendingInput.value === "Sí, asistiré";
        dietaryInput.disabled = !canEditDietary;
        dietaryInput.setAttribute("aria-disabled", String(!canEditDietary));
        dietaryInput.style.opacity = canEditDietary ? "1" : ".5";
        dietaryInput.style.cursor = canEditDietary ? "text" : "not-allowed";
        if (!canEditDietary) dietaryInput.value = "";
      }

      (async () => {
        if (!testId || !testId.trim()) {
          rsvpLoading.textContent = "Este enlace de invitación no es válido.";
          return;
        }
        try {
          invitationRecord = await loadInvitation(testId.trim());
          if (!invitationRecord) {
            rsvpLoading.textContent = "No encontramos esta invitación. Revisa el enlace que recibiste.";
            return;
          }
          const maxPasses = Number(invitationRecord.assigned_passes || 1);
          const displayName = invitationRecord.display_name || "Invitado";
          attendingQuestion.textContent = maxPasses === 1 ? "¿Podrás asistir?" : "¿Podrán asistir?";
          personalInviteName.textContent = displayName;
          personalInviteCopy1.textContent = maxPasses === 1
            ? "Queremos compartir este día contigo."
            : "Queremos compartir este día con ustedes.";
          personalInviteCount.innerHTML = `<span class="pass-number">${maxPasses}</span> <span class="pass-label">${maxPasses === 1 ? "Pase" : "Pases"}</span>`;
          personalInviteSection.classList.remove("is-unavailable");
          guestsCountInput.innerHTML = "";
          for (let n = 1; n <= maxPasses; n++) {
            const option = document.createElement("option");
            option.value = String(n);
            option.textContent = String(n);
            guestsCountInput.appendChild(option);
          }
          const hasPreviousRsvp = invitationRecord.has_rsvp === true;
          attendingInput.value = "";
          guestsCountInput.value = "1";
          guestsCountInput.disabled = true;
          guestsCountInput.required = false;
          guestsCountField.classList.add("hidden");

          if (hasPreviousRsvp && invitationRecord.attending === true) {
            attendingInput.value = "Sí, asistiré";
            guestsCountInput.disabled = false;
            guestsCountInput.required = true;
            guestsCountField.classList.remove("hidden");
            guestsCountInput.value = String(Math.min(Math.max(Number(invitationRecord.guests_count || 1), 1), maxPasses));
          } else if (hasPreviousRsvp && invitationRecord.attending === false) {
            attendingInput.value = "No podré asistir";
            guestsCountInput.value = "0";
          }

          invitationRecord.has_rsvp = hasPreviousRsvp;
          dietaryInput.value = hasPreviousRsvp && invitationRecord.attending === true ? (invitationRecord.dietary_requirements || "") : "";
          syncDietaryAccess();
          messageInput.value = hasPreviousRsvp ? (invitationRecord.message || "") : "";
          syncSongAccess();
          rsvpLoading.classList.add("hidden");
          rsvpForm.classList.remove("hidden");
          rsvpEditNote.classList.remove("hidden");
        } catch (error) {
          console.error(error);
          rsvpLoading.textContent = "No hemos podido cargar tu invitación. Inténtalo nuevamente en unos momentos.";
        }
      })();

      attendingInput.addEventListener("change", () => {
        if (attendingInput.value === "Sí, asistiré") {
          guestsCountField.classList.remove("hidden");
          guestsCountInput.disabled = false;
          guestsCountInput.required = true;
          if (Number(guestsCountInput.value) < 1) guestsCountInput.value = "1";
        } else {
          guestsCountField.classList.add("hidden");
          guestsCountInput.value = "0";
          guestsCountInput.disabled = true;
          guestsCountInput.required = false;
        }
        syncDietaryAccess();
      });

      rsvpForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        formError.classList.add("hidden");

        if (!invitationRecord) {
          formError.textContent = "No hemos podido identificar esta invitación.";
          formError.classList.remove("hidden");
          return;
        }

        if (!attendingInput.value) {
          formError.textContent = "Por favor, selecciona si podrás asistir.";
          formError.classList.remove("hidden");
          attendingInput.focus();
          return;
        }

        submitButton.disabled = true;
        submitButton.style.opacity = ".65";
        const formData = new FormData(rsvpForm);
        const willAttend = String(formData.get("attending")) === "Sí, asistiré";
        const maxPasses = Number(invitationRecord.assigned_passes || 1);
        const requestedGuests = willAttend ? Number(formData.get("guests_count")) : 0;
        if (willAttend && (!Number.isInteger(requestedGuests) || requestedGuests < 1 || requestedGuests > maxPasses)) {
          submitButton.disabled = false;
          submitButton.style.opacity = "1";
          formError.textContent = `Puedes confirmar entre 1 y ${maxPasses} asistente${maxPasses === 1 ? "" : "s"}.`;
          formError.classList.remove("hidden");
          return;
        }
        try {
          const result = await saveRsvp(
            testId.trim(),
            willAttend,
            requestedGuests,
            willAttend ? String(formData.get("dietary_requirements") || "").trim() : "",
            String(formData.get("message") || "").trim()
          );
          if (!result || result.success !== true) throw new Error("RSVP rejected");
          invitationRecord.attending = willAttend;
          invitationRecord.has_rsvp = true;
          invitationRecord.guests_count = requestedGuests;
          syncSongAccess();
          rsvpForm.classList.add("submitted");
          successPanel.classList.add("visible");
          rsvpEditNote.classList.add("hidden");
        } catch (error) {
          console.error(error);
          formError.textContent = "No hemos podido enviar tu confirmación. Por favor, inténtalo de nuevo.";
          formError.classList.remove("hidden");
        } finally {
          submitButton.disabled = false;
          submitButton.style.opacity = "1";
        }
      });

      if (songForm && songInput && songButton && songError && songSuccess) {
        songForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          songError.classList.add("hidden");
          if (!invitationRecord || invitationRecord.has_rsvp !== true || invitationRecord.attending !== true) {
            songError.textContent = "Primero debes confirmar que podrás asistir.";
            songError.classList.remove("hidden");
            syncSongAccess();
            return;
          }
          const suggestion = songInput.value.trim();
          if (!suggestion) {
            songError.textContent = "Por favor, escribe una canción o artista.";
            songError.classList.remove("hidden");
            return;
          }
          if (!testId || !testId.trim()) {
            songError.textContent = "No hemos podido identificar esta invitación.";
            songError.classList.remove("hidden");
            return;
          }
          songButton.disabled = true;
          songButton.style.opacity = ".65";
          try {
            const result = await saveSongSuggestion(testId.trim(), suggestion);
            if (!result || result.success !== true) throw new Error("Song rejected");
            songForm.reset();
            songForm.classList.remove("song-form-enabled");
            songForm.classList.add("song-form-submitted");
            songSuccess.classList.add("visible");
          } catch (error) {
            console.error(error);
            songError.textContent = "No hemos podido enviar tu sugerencia. Por favor, inténtalo de nuevo.";
            songError.classList.remove("hidden");
          } finally {
            songButton.disabled = false;
            songButton.style.opacity = "1";
          }
        });
      }

    }

    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
 
<script>

// V3: activate itinerary scene animations only while visible.
(() => {
  const items = document.querySelectorAll(".timeline-icon");
  if (!("IntersectionObserver" in window)) { items.forEach(x=>x.classList.add("is-visible")); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => e.target.classList.toggle("is-visible", e.isIntersecting));
  }, {threshold:.45});
  items.forEach(x=>io.observe(x));

  document.querySelectorAll(".animated-heart").forEach(h=>{
    const react=()=>{ h.animate([{transform:"scale(1)"},{transform:"scale(1.18)"},{transform:"scale(1)"}],{duration:520,easing:"ease-out"}); };
    h.addEventListener("click",react);
    h.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();react();}});
  });
})();

</script>
<script>

(() => {
  // Hero: names -> filled heart -> phrase
  const title = document.querySelector('[data-template-id="welcome-title"]');
  const heartHost = document.querySelector('[data-template-id="welcome-heart"]');
  const tagline = document.querySelector('[data-template-id="welcome-tagline"]');
  if (title && heartHost && tagline) {
    title.insertAdjacentElement('afterend', heartHost);
    heartHost.insertAdjacentElement('afterend', tagline);
  }

  // Filled hearts: tap particles.
  document.querySelectorAll('.hero-filled-heart').forEach(h => {
    const react = () => {
      h.classList.remove('is-tapped'); void h.offsetWidth; h.classList.add('is-tapped');
      setTimeout(()=>h.classList.remove('is-tapped'), 1050);
    };
    h.addEventListener('click', react);
    h.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();react();} });
  });

  // Calendar Saturday and 3: robust text targeting, plus round line heart.
  const dateSection = document.querySelector('[data-template-id="date-section"]') || document;
  [...dateSection.querySelectorAll('*')].forEach(el => {
    if (el.children.length===0 && el.textContent.trim()==='Sáb') el.classList.add('calendar-sat-label');
  });
  const threes = [...dateSection.querySelectorAll('*')].filter(el => el.children.length===0 && el.textContent.trim()==='3');
  const day3 = threes.find(el => {
    const r=el.getBoundingClientRect(); return r.width<100 && r.height<100;
  });
  if(day3){
    day3.classList.add('calendar-day-3');
    const parent=day3.parentElement;
    if(parent){
      parent.style.position='relative';
      parent.querySelectorAll('svg').forEach(s=>s.style.display='none');
      const h=document.createElement('span');
      h.className='calendar-heart-v4';
      h.innerHTML='<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 52C25 44 12 35 12 23.5 12 16.8 16.8 12 23 12c4.2 0 7.2 2.3 9 5.5 1.8-3.2 4.8-5.5 9-5.5 6.2 0 11 4.8 11 11.5C52 35 39 44 32 52Z"/></svg>';
      parent.appendChild(h);
      h.addEventListener('click',()=>h.animate([{transform:'translate(-50%,-48%) scale(1)'},{transform:'translate(-50%,-48%) scale(1.10)'},{transform:'translate(-50%,-48%) scale(1)'}],{duration:480,easing:'ease-out'}));
    }
  }

  // Itinerary: animate only when each illustration is on screen.
  const icons=document.querySelectorAll('.timeline-icon');
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(entries=>entries.forEach(e=>e.target.classList.toggle('is-visible',e.isIntersecting)),{threshold:.42});
    icons.forEach(x=>io.observe(x));
  } else icons.forEach(x=>x.classList.add('is-visible'));
})();

</script>
